<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Duel — a duel of ember, element and nerve</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #0e1f1a; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #wrap { width: 1280px; max-width: 100vw; }
  canvas {
    display: block; width: 1280px; max-width: 100vw; height: auto;
    aspect-ratio: 1280 / 720; background: #1d3d33; cursor: pointer;
    border-radius: 6px;
  }
  #hint {
    color: rgba(253,246,227,0.65); font-size: 13px; text-align: center;
    margin: 8px 0 0; user-select: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <p id="hint">Ember Duel — click a card to play it, click a creature to attack, End Turn to pass. H for help.</p>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
